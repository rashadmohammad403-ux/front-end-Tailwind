<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-[#F1F5F9]">
  <div class="w-fit m-auto mt-15 flex gap-3" >
    <img src="./imgs/Login-to-Account-page/Container.png">
    <img src="./imgs/Login-to-Account-page/Heading 1.png">
  </div>
  <div class="w-fit m-auto mt-5 bg-white rounded-md border-1 border-[#C6C6CD] px-10 py-10">
    <h3 class="mt-5">Welcome back</h3>
    <p class="mt-3 text-[#45464D]">Log in to your premium tech ecosystem.</p>
    <p class="mt-6 text-[#45464D]">Email Address</p>
    <form class="relative mt-2">
      <label>
      <img src="./imgs/Login-to-Account-page/Container.svg" class="absolute left-2 top-4">
      <input type="email" placeholder="name@company.com" class="bg-[#F1F5F9] pr-30 pl-10 py-3 rounded-md">
      </label>
    </form>
    <div class="flex justify-between mt-6">
      <p class="text-[#45464D]">Password</p>
      <p class="text-[#0058BE]">Forgot password?</p>
    </div>
    <form class="mt-2 relative">
      <label>
        <img src="./imgs/Login-to-Account-page/Container (1).svg" class="absolute left-2 top-4">
        <img src="./imgs/Login-to-Account-page/Button.svg" class="absolute right-2 top-4">
        <input type="password" placeholder="••••••••" class="bg-[#F1F5F9] pr-30 pl-10 py-3 rounded-md">
      </label>
    </form>
    <a href="#" class="flex gap-2 pl-2 pr-10 bg-[#F6F3F5] rounded-lg mt-4 border-1 border-[#C6C6CD] py-0.5 items-center">
      <img src="./imgs/Login-to-Account-page/Icon.png" class="h-3">
      <p class="text-[#45464D]">Secure, encrypted connection</p>
    </a>
    <a href="index.html">
    <button class="flex gap-2  bg-[#131B2E] py-2 px-32 mt-5 rounded-md items-center">
      <h4 class="text-white">Login</h4>
      <img src="./imgs/Login-to-Account-page/sahm.png" class="h-4">
    </button></a>
    <div class="flex items-center mt-10">
      <div class="flex-1 border-t border-t-[#C6C6CD]"></div>
      <p class="mx-2 text-[10px] text-[#45464D]">Or continue with</p>
      <div class="flex-1 border-t border-t-[#C6C6CD]"></div>
    </div>
    <div class="flex gap-2 mt-7">
      <a href="#" class="flex gap-3 px-11 py-3 border-1 border-[#C6C6CD] rounded-md">
        <img src="./imgs/Login-to-Account-page/SVG.png">
        <p>Google</p>
      </a>
      <a href="#" class="flex gap-3 px-11 py-3 border-1 border-[#C6C6CD] rounded-md">
        <img src="./imgs/Login-to-Account-page/SVG (1).png">
        <p>Apple</p>
      </a>
    </div>
  </div>

  <P class="text-[#45464D] mt-3 w-fit m-auto">New to ELECTRO? <span class="text-[#0058BE]">Create an account</span></P>
  <P class="w-fit m-auto mt-15 mb-5 text-[#C6C6CD]">© 2024 ELECTRO Premium Electronics. All rights reserved.</P>


</body>
</html>
