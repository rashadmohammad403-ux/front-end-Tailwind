<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
   <link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-[#DAE2FD] relative">
  <div class="w-fit m-auto mt-15 flex gap-3">
    <img src="./imgs/create-Account-page/Container.png">
    <h4>ELECTRO</h4>
  </div>
<div class="bg-white w-fit m-auto mt-5 px-10 py-10 rounded-md border-1 border-[#C6C6CD]">
    <h3 class="mt-6 text-center">Create an account</h3>
    <p class="text-[#45464D] mt-3 text-center">Join the future of premium electronics.</p>
    <div class="flex gap-2 mt-7">
      <a href="#" class="flex gap-3 px-14 py-3 border-1 border-[#C6C6CD] rounded-md">
        <img src="./imgs/create-Account-page/SVG.png">
        <p>Google</p>
      </a>
      <a href="#" class="flex gap-3 px-14 py-3 border-1 border-[#C6C6CD] rounded-md">
        <img src="./imgs/create-Account-page/SVG (1).png">
        <p>Apple</p>
      </a>
    </div>
    <div class="flex items-center mt-10">
      <div class="flex-1 border-t border-t-[#C6C6CD]"></div>
      <p class="mx-2 text-[10px] text-[#45464D]">OR WITH EMAIL</p>
      <div class="flex-1 border-t border-t-[#C6C6CD]"></div>
    </div>
    <h5 class="mt-12">Full Name</h5>
    <form class="relative mt-2">
      <label>
        <img src="./imgs/create-Account-page/Container.svg" class="absolute left-3 top-4">
        <input type="text" placeholder="John Doe" class="bg-[#F6F3F5] pr-40 pl-12 py-3 rounded-md">
      </label>
    </form>
    <h5 class="mt-5">Email Address</h5>
     <form class="relative mt-2">
      <label>
        <img src="./imgs/create-Account-page/Container (1).svg" class="absolute left-3 top-4">
        <input type="email" placeholder="john@example.com" class="bg-[#F6F3F5] pr-40 pl-12 py-3 rounded-md">
      </label>
    </form>

    <div class="mt-5 flex gap-5">
      <div>
     <h5>Password</h5>
     <form class="relative mt-2">
      <label>
        <img src="./imgs/create-Account-page/Container (2).svg" class="absolute top-4 left-4">
        <input type="password" placeholder="••••••••" class="bg-[#F6F3F5] text-center py-3 pr-1 rounded-md">
      </label>
    </form>
      </div>
      <div>
     <h5>Confirm</h5>
     <form class="relative mt-2">
      <label>
        <img src="./imgs/create-Account-page/Icon.svg" class="absolute top-4 left-4">
        <input type="password" placeholder="••••••••" class="bg-[#F6F3F5] text-center py-3 pr-1  rounded-md">
      </label>
    </form>
      </div>
    </div>
    <div class="flex items-center gap-2 mt-5">
    <input type="checkbox">
    <p class="text-[#45464D]">I agree to the   <span class="text-[#0058BE]">Terms of Service </span>and <span class="text-[#0058BE]">Privacy Policy.</span></p>
    </div>
    <button class="mt-5 h-12 w-full bg-[#131B2E] rounded-md"></button>
    <p class="mt-12 text-center text-[#45464D]">Already have an account? <span class="text-[#0058BE]"><a href="index.html">Login</a></span></p>
  </div>
  <A href="iPads.html">
<img src="./imgs/create-Account-page/Overlay+Border+Shadow.png" class="absolute bottom-2 right-2 opacity-50 hidden lg:block hover:opacity-100">
</A>
</body>
</html>
